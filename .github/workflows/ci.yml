name: CI Pipeline

# Stage order mirrors docs/linting.md: fail fast on cheap checks first.
#   1. Oxlint      (~15 ms, fail-fast)
#   2. ESLint      (deep AST + hooks + accessibility rule)
#   3. Vitest      (frontend unit/component + build-script unit tests)
#   4. Typecheck & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint-fast:
    name: ⚡ Stage 1 - Oxlint (Fail-Fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run Oxlint
        working-directory: frontend
        run: npm run lint:fast

  lint-deep:
    name: 🔍 Stage 2 - ESLint (Deep Validation)
    needs: lint-fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint:deep

  test:
    name: 🧪 Stage 3 - Vitest
    needs: lint-deep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install build-tooling dependencies
        run: npm install

      - name: Frontend unit & component tests
        working-directory: frontend
        run: npm run test:run

      - name: Build-script unit tests (sellers.json ETL)
        run: npm test

  backend-test:
    name: 🧪 Backend tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run backend tests
        working-directory: backend
        run: npm test

  build:
    name: 📦 Stage 4 - Typecheck & Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Verify the MSW service worker ships in the build
        working-directory: frontend
        run: test -f dist/mockServiceWorker.js

  security-scan:
    name: 🔒 Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '0'

  data-snapshot:
    name: 🗺️ Ecosystem data snapshot (sellers.json ETL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install build-tooling dependencies
        run: npm install

      # The committed snapshot is the deterministic curated seed, not a live
      # crawl: `sellers.json` contents change upstream, so a live fetch would make
      # CI non-reproducible. This asserts the seed is intact and inside budget.
      # Enrichment is an explicit manual `npm run etl` when the seed changes.
      - name: Verify the ecosystem snapshot is reproducible and current
        run: |
          npm run etl:offline
          if ! git diff --exit-code -- frontend/src/data/ecosystem-nodes.json; then
            echo "::error::ecosystem-nodes.json is stale. Run 'npm run etl:offline' and commit the result."
            exit 1
          fi
          SIZE=$(wc -c < frontend/src/data/ecosystem-nodes.json)
          echo "ecosystem-nodes.json is ${SIZE} bytes (budget 409600)"