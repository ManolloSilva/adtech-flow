services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adtech-flow-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adtech-flow-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DB_PATH=/data/adtech.db
    volumes:
      - adtech-data:/data

volumes:
  adtech-data: